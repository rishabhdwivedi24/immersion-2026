<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin: 0;
        }

        header {
            background-color: #0078ff;
            color: white;
            padding: 20px;
        }

        .container {
            margin: 50px;
        }

        button {
            background-color: #0078ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #005ecb;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Website</h1>
    </header>

    <div class="container">
        <h2>Hello World!</h2>
        <p>This is a simple HTML and CSS webpage.</p>
        <button onclick="alert('Button Clicked!')">
            Click Me
        </button>
    </div>

</body>
</html>
